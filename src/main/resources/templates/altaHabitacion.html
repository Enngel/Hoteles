<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alta Habitación | Hotel</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f0f4f8; }
        .navbar-custom { background: linear-gradient(135deg, #1a1a2e, #0f3460); }
        .form-card {
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            overflow: hidden;
        }
        .form-header {
            background: linear-gradient(135deg, #e2b96f, #c9973a);
            color: #1a1a2e;
            padding: 2rem;
        }
        .form-body { padding: 2rem; background: white; }
        .form-label { font-weight: 600; color: #333; }
        .form-control:focus, .form-select:focus {
            border-color: #e2b96f;
            box-shadow: 0 0 0 0.25rem rgba(226,185,111,0.25);
        }
        .btn-guardar {
            background: linear-gradient(135deg, #e2b96f, #c9973a);
            border: none;
            color: #1a1a2e;
            font-weight: 700;
            padding: 12px 40px;
            border-radius: 50px;
        }
        .btn-guardar:hover { opacity: 0.9; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark navbar-custom px-4 py-3 mb-4">
    <a class="navbar-brand fw-bold" href="/inicio">🏨 Hotel · Engel Nieves</a>
    <div class="d-flex gap-2">
        <a href="/listadoHabitacion" class="btn btn-outline-light btn-sm">Ver listado</a>
    </div>
</nav>

<div class="container pb-5" style="max-width: 640px;">
    <div class="form-card">

        <!-- Cabecera del formulario -->
        <div class="form-header">
            <h3 class="mb-1"><i class="bi bi-door-open me-2"></i>Nueva Habitación</h3>
            <p class="mb-0 small">Completa los datos para registrar una habitación.</p>
        </div>

        <!-- Formulario -->
        <div class="form-body">
            <form action="/altaHabitacion" method="post" th:object="${habitacion}">

                <!-- Tipo -->
                <div class="mb-4">
                    <label for="tipo" class="form-label">Tipo de habitación</label>
                    <select class="form-select" id="tipo" th:field="*{tipo}"
                            th:classappend="${#fields.hasErrors('tipo')} ? ' is-invalid' : ''">
                        <option value="">-- Selecciona un tipo --</option>
                        <option value="Simple">Simple</option>
                        <option value="Doble">Doble</option>
                        <option value="Suite">Suite</option>
                        <option value="Familiar">Familiar</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{tipo}"></div>
                </div>

                <!-- Precio por noche -->
                <div class="mb-4">
                    <label for="precioPorNoche" class="form-label">Precio por noche (€)</label>
                    <div class="input-group">
                        <span class="input-group-text">€</span>
                        <input type="number" step="0.01" min="0.01" class="form-control"
                               id="precioPorNoche" th:field="*{precioPorNoche}"
                               placeholder="Ej: 120.00"
                               th:classappend="${#fields.hasErrors('precioPorNoche')} ? ' is-invalid' : ''">
                        <div class="invalid-feedback" th:errors="*{precioPorNoche}"></div>
                    </div>
                </div>

                <!-- Capacidad -->
                <div class="mb-4">
                    <label for="capacidad" class="form-label">Capacidad (personas)</label>
                    <input type="number" min="1" max="10" class="form-control"
                           id="capacidad" th:field="*{capacidad}"
                           placeholder="Ej: 2"
                           th:classappend="${#fields.hasErrors('capacidad')} ? ' is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{capacidad}"></div>
                </div>

                <!-- Descripción -->
                <div class="mb-4">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea class="form-control" id="descripcion" th:field="*{descripcion}"
                              rows="3" placeholder="Describe la habitación..."
                              th:classappend="${#fields.hasErrors('descripcion')} ? ' is-invalid' : ''"></textarea>
                    <div class="invalid-feedback" th:errors="*{descripcion}"></div>
                </div>

                <!-- Disponible -->
                <div class="mb-4">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch"
                               id="disponible" th:field="*{disponible}">
                        <label class="form-check-label fw-semibold" for="disponible">
                            Disponible para reservas
                        </label>
                    </div>
                </div>

                <!-- Botones -->
                <div class="d-flex gap-3 justify-content-center mt-4">
                    <a href="/listadoHabitacion" class="btn btn-outline-secondary px-4 rounded-pill">Cancelar</a>
                    <button type="submit" class="btn-guardar btn">
                        <i class="bi bi-floppy me-2"></i>Guardar Habitación
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
