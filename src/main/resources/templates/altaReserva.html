<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alta Reserva | Hotel</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f0f4f8; }
        .navbar-custom { background: linear-gradient(135deg, #1a1a2e, #0f3460); }
        .form-card { border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); overflow: hidden; }
        .form-header {
            background: linear-gradient(135deg, #0d6efd, #0f3460);
            color: white; padding: 2rem;
        }
        .form-body { padding: 2rem; background: white; }
        .form-label { font-weight: 600; color: #333; }
        .form-control:focus, .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13,110,253,0.2);
        }
        .btn-guardar {
            background: linear-gradient(135deg, #0d6efd, #0f3460);
            border: none; color: white;
            font-weight: 700; padding: 12px 40px; border-radius: 50px;
        }
        .btn-guardar:hover { opacity: 0.9; color: white; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark navbar-custom px-4 py-3 mb-4">
    <a class="navbar-brand fw-bold" href="/inicio">🏨 Hotel · Engel Nieves</a>
    <div class="d-flex gap-2">
        <a href="/listadoReserva" class="btn btn-outline-light btn-sm">Ver listado</a>
    </div>
</nav>

<div class="container pb-5" style="max-width: 680px;">
    <div class="form-card">

        <div class="form-header">
            <h3 class="mb-1"><i class="bi bi-calendar-plus me-2"></i>Nueva Reserva</h3>
            <p class="mb-0 small">Completa los datos para registrar una reserva.</p>
        </div>

        <div class="form-body">
            <form action="/altaReserva" method="post" th:object="${reserva}">

                <!-- Nombre cliente -->
                <div class="mb-4">
                    <label for="nombreCliente" class="form-label">Nombre del cliente</label>
                    <input type="text" class="form-control" id="nombreCliente"
                           th:field="*{nombreCliente}" placeholder="Nombre completo"
                           th:classappend="${#fields.hasErrors('nombreCliente')} ? ' is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{nombreCliente}"></div>
                </div>

                <!-- Email -->
                <div class="mb-4">
                    <label for="emailCliente" class="form-label">Email del cliente</label>
                    <input type="email" class="form-control" id="emailCliente"
                           th:field="*{emailCliente}" placeholder="correo@ejemplo.com"
                           th:classappend="${#fields.hasErrors('emailCliente')} ? ' is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{emailCliente}"></div>
                </div>

                <!-- Fechas -->
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="fechaEntrada" class="form-label">Fecha de entrada</label>
                        <input type="date" class="form-control" id="fechaEntrada"
                               th:field="*{fechaEntrada}"
                               th:classappend="${#fields.hasErrors('fechaEntrada')} ? ' is-invalid' : ''">
                        <div class="invalid-feedback" th:errors="*{fechaEntrada}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="fechaSalida" class="form-label">Fecha de salida</label>
                        <input type="date" class="form-control" id="fechaSalida"
                               th:field="*{fechaSalida}"
                               th:classappend="${#fields.hasErrors('fechaSalida')} ? ' is-invalid' : ''">
                        <div class="invalid-feedback" th:errors="*{fechaSalida}"></div>
                    </div>
                </div>

                <!-- Número de personas -->
                <div class="mb-4">
                    <label for="numPersonas" class="form-label">Número de personas</label>
                    <input type="number" min="1" max="10" class="form-control"
                           id="numPersonas" th:field="*{numPersonas}" placeholder="Ej: 2"
                           th:classappend="${#fields.hasErrors('numPersonas')} ? ' is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{numPersonas}"></div>
                </div>

                <!-- Habitación -->
                <div class="mb-4">
                    <label for="habitacion" class="form-label">Habitación</label>
                    <select class="form-select" id="habitacion"
                            th:field="*{habitacion}"
                            th:classappend="${#fields.hasErrors('habitacion')} ? ' is-invalid' : ''">
                        <option value="">-- Selecciona una habitación --</option>
                        <option th:each="hab : ${habitaciones}"
                                th:value="${hab.id}"
                                th:text="${'#' + hab.id + ' · ' + hab.tipo + ' · €' + hab.precioPorNoche + '/noche · Cap. ' + hab.capacidad}">
                        </option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{habitacion}"></div>
                </div>

                <!-- Observaciones -->
                <div class="mb-4">
                    <label for="observaciones" class="form-label">Observaciones <span class="text-muted fw-normal">(opcional)</span></label>
                    <textarea class="form-control" id="observaciones" th:field="*{observaciones}"
                              rows="3" placeholder="Necesidades especiales, alergias, preferencias..."></textarea>
                </div>

                <!-- Botones -->
                <div class="d-flex gap-3 justify-content-center mt-4">
                    <a href="/listadoReserva" class="btn btn-outline-secondary px-4 rounded-pill">Cancelar</a>
                    <button type="submit" class="btn-guardar btn">
                        <i class="bi bi-floppy me-2"></i>Guardar Reserva
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
