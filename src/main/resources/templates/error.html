<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error | Hotel</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .error-card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            max-width: 540px;
            width: 100%;
            padding: 3rem 2.5rem;
            text-align: center;
            color: white;
        }
        .error-code {
            font-size: 7rem;
            font-weight: 900;
            background: linear-gradient(135deg, #e2b96f, #c9973a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }
        .error-icon { font-size: 4rem; margin-bottom: 1rem; }
        .btn-home {
            background: linear-gradient(135deg, #e2b96f, #c9973a);
            border: none; color: #1a1a2e;
            font-weight: 700; padding: 12px 36px;
            border-radius: 50px; text-decoration: none;
            display: inline-block; margin-top: 1.5rem;
            transition: opacity 0.3s;
        }
        .btn-home:hover { opacity: 0.85; color: #1a1a2e; }
    </style>
</head>
<body>
<div class="error-card">
    <div class="error-icon">🏨</div>
    <div class="error-code" th:text="${status}">Error</div>
    <h2 class="mt-3 mb-2">¡Algo ha salido mal!</h2>
    <p class="text-white-50 mb-1" th:text="${error}">Se ha producido un error inesperado.</p>
    <p class="text-white-50 small" th:text="${message}"></p>
    <a href="/inicio" class="btn-home">
        🏠 Volver al inicio
    </a>
    <p class="mt-4 text-white-25" style="color:rgba(255,255,255,0.25); font-size:.8rem;">
        Hotel Engel Nieves · Práctica UT8-RA9
    </p>
</div>
</body>
</html>
