<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listado de Habitaciones | Hotel</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f0f4f8; }
        .navbar-custom { background: linear-gradient(135deg, #1a1a2e, #0f3460); }
        .page-header {
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            color: white;
            border-radius: 15px;
            padding: 2rem;
        }
        .table-card {
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .table thead th {
            background: #0f3460;
            color: white;
            border: none;
            font-weight: 600;
        }
        .table tbody tr:hover { background: #e8f4fd; }
        .badge-tipo { font-size: 0.8rem; padding: 6px 12px; border-radius: 20px; }
        .badge-simple   { background: #6c757d; color: white; }
        .badge-doble    { background: #0d6efd; color: white; }
        .badge-suite    { background: #e2b96f; color: #1a1a2e; }
        .badge-familiar { background: #198754; color: white; }
        .precio { font-weight: 700; color: #0f3460; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark navbar-custom px-4 py-3 mb-4">
    <a class="navbar-brand fw-bold" href="/inicio">🏨 Hotel · Engel Nieves</a>
    <div class="d-flex gap-2">
        <a href="/listadoReserva"  class="btn btn-outline-light btn-sm">Reservas</a>
        <a href="/altaHabitacion"  class="btn btn-warning btn-sm text-dark fw-bold">+ Nueva</a>
    </div>
</nav>

<div class="container pb-5">

    <!-- Cabecera -->
    <div class="page-header mb-4 d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div>
            <h2 class="mb-1"><i class="bi bi-door-open me-2"></i>Habitaciones</h2>
            <p class="mb-0 text-white-50">
                <span th:text="${habitaciones.size()}">0</span> habitaciones registradas
            </p>
        </div>
        <a href="/altaHabitacion" class="btn btn-warning fw-bold">
            <i class="bi bi-plus-circle me-2"></i>Añadir Habitación
        </a>
    </div>

    <!-- Tabla -->
    <div class="table-card bg-white">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Tipo</th>
                    <th>Precio / noche</th>
                    <th>Capacidad</th>
                    <th>Descripción</th>
                    <th>Disponible</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${habitaciones.isEmpty()}">
                    <td colspan="6" class="text-center text-muted py-4">No hay habitaciones registradas.</td>
                </tr>
                <tr th:each="hab : ${habitaciones}">
                    <td class="fw-bold text-muted" th:text="${hab.id}"></td>
                    <td>
                        <span th:text="${hab.tipo}"
                              th:class="${'badge badge-tipo badge-' + hab.tipo.toLowerCase()}"></span>
                    </td>
                    <td class="precio" th:text="${'€ ' + #numbers.formatDecimal(hab.precioPorNoche, 1, 2)}"></td>
                    <td>
                        <i class="bi bi-people-fill text-muted me-1"></i>
                        <span th:text="${hab.capacidad}"></span>
                    </td>
                    <td class="text-muted small" th:text="${hab.descripcion}"></td>
                    <td>
                        <span th:if="${hab.disponible}"  class="badge bg-success"><i class="bi bi-check-circle me-1"></i>Disponible</span>
                        <span th:unless="${hab.disponible}" class="badge bg-danger"><i class="bi bi-x-circle me-1"></i>Ocupada</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
