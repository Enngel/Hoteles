<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listado de Reservas | Hotel</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f0f4f8; }
        .navbar-custom { background: linear-gradient(135deg, #1a1a2e, #0f3460); }
        .page-header {
            background: linear-gradient(135deg, #0d6efd, #0f3460);
            color: white; border-radius: 15px; padding: 2rem;
        }
        .table-card { border-radius: 15px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .table thead th { background: #0f3460; color: white; border: none; font-weight: 600; }
        .table tbody tr:hover { background: #e8f4fd; }
        .fecha { font-family: monospace; color: #0f3460; font-weight: 600; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark navbar-custom px-4 py-3 mb-4">
    <a class="navbar-brand fw-bold" href="/inicio">🏨 Hotel · Engel Nieves</a>
    <div class="d-flex gap-2">
        <a href="/listadoHabitacion" class="btn btn-outline-light btn-sm">Habitaciones</a>
        <a href="/altaReserva"       class="btn btn-warning btn-sm text-dark fw-bold">+ Nueva</a>
    </div>
</nav>

<div class="container pb-5">

    <!-- Cabecera -->
    <div class="page-header mb-4 d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div>
            <h2 class="mb-1"><i class="bi bi-calendar-check me-2"></i>Reservas</h2>
            <p class="mb-0 text-white-50">
                <span th:text="${reservas.size()}">0</span> reservas registradas
            </p>
        </div>
        <a href="/altaReserva" class="btn btn-warning fw-bold">
            <i class="bi bi-plus-circle me-2"></i>Añadir Reserva
        </a>
    </div>

    <!-- Tabla -->
    <div class="table-card bg-white">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Cliente</th>
                    <th>Email</th>
                    <th>Habitación</th>
                    <th>Entrada</th>
                    <th>Salida</th>
                    <th>Personas</th>
                    <th>Observaciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${reservas.isEmpty()}">
                    <td colspan="8" class="text-center text-muted py-4">No hay reservas registradas.</td>
                </tr>
                <tr th:each="res : ${reservas}">
                    <td class="fw-bold text-muted" th:text="${res.id}"></td>
                    <td class="fw-semibold" th:text="${res.nombreCliente}"></td>
                    <td class="text-muted small" th:text="${res.emailCliente}"></td>
                    <td>
                        <span class="badge bg-primary" th:text="${res.habitacion.tipo}"></span>
                        <span class="text-muted small" th:text="'#' + res.habitacion.id"></span>
                    </td>
                    <td class="fecha" th:text="${res.fechaEntrada}"></td>
                    <td class="fecha" th:text="${res.fechaSalida}"></td>
                    <td class="text-center">
                        <i class="bi bi-people-fill text-muted me-1"></i>
                        <span th:text="${res.numPersonas}"></span>
                    </td>
                    <td class="text-muted small" th:text="${res.observaciones}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
